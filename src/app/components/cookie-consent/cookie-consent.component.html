@if (visible()) {
  <div
    class="fixed bottom-0 left-0 w-full z-[100] p-4 sm:p-6 animate-fade-in-up"
    role="dialog"
    aria-live="polite"
    aria-label="Aviso de cookies"
  >
    <div class="max-w-4xl mx-auto bg-white border border-gray-200 rounded-2xl shadow-xl p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center gap-4">
      <div class="flex items-start gap-3 flex-1">
        <span class="text-2xl leading-none" aria-hidden="true">🍪</span>
        <p class="text-sm text-gray-600 leading-relaxed">
          Usamos cookies para mantener tu sesión activa, recordar tus preferencias y mejorar tu experiencia en StudyHub.
          Puedes aceptarlas todas o continuar solo con las esenciales.
          <a
            href="/terminos#cookies"
            target="_blank"
            rel="noopener"
            class="text-[#00a699] font-medium hover:text-[#075955] transition-colors duration-300"
          >Más información</a>
        </p>
      </div>

      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 shrink-0">
        <button
          type="button"
          (click)="acceptEssential()"
          class="px-5 py-2.5 rounded-md text-sm font-medium text-[#075955] bg-white border border-gray-200 transition-all duration-300 hover:bg-gray-50"
        >
          Solo esenciales
        </button>
        <button
          type="button"
          (click)="acceptAll()"
          class="px-5 py-2.5 rounded-md text-sm font-medium text-white bg-[#075955] transition-all duration-300 hover:bg-[#fbb253] hover:text-[#075955]"
        >
          Aceptar todas
        </button>
      </div>
    </div>
  </div>
}
