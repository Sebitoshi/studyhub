<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50" (click)="close.emit()">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto" (click)="$event.stopPropagation()">
    <div class="p-6">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">{{ event ? 'Editar evento' : 'Nuevo evento' }}</h2>
        <button (click)="close.emit()" class="text-gray-400 hover:text-gray-600 transition-colors cursor-pointer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <!-- Title -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Título</label>
        <input type="text" [(ngModel)]="title" placeholder="Examen de Cálculo..."
          class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-[#0f766e] focus:border-transparent" />
      </div>

      <!-- Description -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
        <textarea [(ngModel)]="description" rows="2" placeholder="Opcional..."
          class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-[#0f766e] focus:border-transparent resize-none"></textarea>
      </div>

      <!-- Type + Subject -->
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tipo</label>
          <select [(ngModel)]="type" class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-[#0f766e] focus:border-transparent cursor-pointer">
            <option value="EVENT">Evento</option>
            <option value="EXAM">Examen</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Materia</label>
          <select [(ngModel)]="subjectId" class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-[#0f766e] focus:border-transparent cursor-pointer">
            <option [ngValue]="null">Sin materia</option>
            @for (s of subjects; track s.id) {
              <option [ngValue]="s.id">{{ s.nombre }}</option>
            }
          </select>
        </div>
      </div>

      <!-- Dates -->
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Fecha inicio</label>
          <input type="date" [(ngModel)]="startDate"
            class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-[#0f766e] focus:border-transparent" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Fecha fin</label>
          <input type="date" [(ngModel)]="endDate"
            class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-[#0f766e] focus:border-transparent" />
        </div>
      </div>

      @if (!allDay) {
        <div class="grid grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Hora inicio</label>
            <input type="time" [(ngModel)]="startTime"
              class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-[#0f766e] focus:border-transparent" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Hora fin</label>
            <input type="time" [(ngModel)]="endTime"
              class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-[#0f766e] focus:border-transparent" />
          </div>
        </div>
      }

      <!-- All Day Toggle -->
      <div class="mb-4">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" [(ngModel)]="allDay" class="w-4 h-4 rounded border-gray-300 text-[#0f766e] focus:ring-[#0f766e]" />
          <span class="text-sm text-gray-700">Todo el día</span>
        </label>
      </div>

      <!-- Color Picker -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Color</label>
        <div class="flex gap-2">
          @for (c of colors; track c) {
            <button (click)="color = c"
              class="w-8 h-8 rounded-full border-2 transition-transform hover:scale-110 cursor-pointer"
              [style.background]="c"
              [class.border-gray-900]="color === c"
              [class.border-transparent]="color !== c">
            </button>
          }
        </div>
      </div>

      @if (errorMessage) {
        <p class="mb-4 rounded-xl border border-red-100 bg-red-50 px-3 py-2 text-sm text-red-700">{{ errorMessage }}</p>
      }

      <!-- Actions -->
      <div class="flex items-center justify-between">
        <div>
          @if (event) {
            <button (click)="onDelete()" class="px-4 py-2 rounded-lg text-sm font-medium text-red-600 hover:bg-red-50 transition-colors cursor-pointer">
              Eliminar
            </button>
          }
        </div>
        <div class="flex items-center gap-3">
          <button (click)="close.emit()" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors cursor-pointer">Cancelar</button>
          <button (click)="onSave()" [disabled]="!title.trim() || saving"
            class="px-5 py-2 rounded-lg text-sm font-medium text-white transition-all hover:brightness-110 disabled:opacity-50 cursor-pointer"
            style="background: #0f766e;">
            {{ saving ? 'Guardando…' : (event ? 'Guardar cambios' : 'Crear evento') }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
